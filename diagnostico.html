<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico Script</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f0f4f8; --surface:#fff; --border:#d1dce8; --accent:#1a6fbd; --text:#1e293b; --muted:#64748b; --ok:#16a34a; --err:#dc2626; --warn:#d97706; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); padding:24px 16px; }
    .container { max-width:720px; margin:0 auto; }
    h1 { font-size:1.1rem; font-weight:600; color:var(--text); margin-bottom:4px; }
    p.sub { font-size:.78rem; color:var(--muted); margin-bottom:24px; }

    .url-row { display:flex; gap:8px; margin-bottom:20px; }
    .url-row input { flex:1; font-family:'DM Mono',monospace; font-size:.8rem; background:var(--surface); border:1.5px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); outline:none; }
    .url-row input:focus { border-color:var(--accent); }
    .btn { padding:9px 16px; background:var(--accent); color:#fff; font-family:'DM Sans',sans-serif; font-size:.85rem; font-weight:600; border:none; border-radius:8px; cursor:pointer; white-space:nowrap; }
    .btn:hover { background:#134f8a; }

    .test-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden; }
    .test-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); }
    .test-name { font-size:.88rem; font-weight:600; color:var(--text); }
    .test-accion { font-family:'DM Mono',monospace; font-size:.72rem; color:var(--muted); }
    .btn-test { padding:6px 14px; background:var(--bg); border:1px solid var(--border); border-radius:6px; font-size:.78rem; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; color:var(--text); }
    .btn-test:hover { background:var(--border); }
    .test-body { padding:12px 16px; }
    .estado { display:inline-flex; align-items:center; gap:5px; font-size:.75rem; font-weight:600; padding:3px 10px; border-radius:99px; margin-bottom:8px; }
    .estado.esperando { background:#f1f5f9; color:var(--muted); }
    .estado.ok        { background:#dcfce7; color:var(--ok); }
    .estado.error     { background:#fee2e2; color:var(--err); }
    .estado.cargando  { background:#eff6ff; color:var(--accent); }
    .spinner-sm { width:10px; height:10px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .respuesta {
      font-family:'DM Mono',monospace; font-size:.72rem; background:#f8fafc;
      border:1px solid var(--border); border-radius:6px; padding:10px 12px;
      color:var(--text); white-space:pre-wrap; word-break:break-all;
      max-height:180px; overflow-y:auto; line-height:1.6;
    }
    .tiempo { font-size:.68rem; color:var(--muted); margin-top:6px; }

    .resumen { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px; margin-bottom:20px; }
    .resumen h2 { font-size:.85rem; font-weight:600; color:var(--text); margin-bottom:10px; }
    .resumen ul { list-style:none; display:flex; flex-direction:column; gap:5px; }
    .resumen li { font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    .dot.ok { background:var(--ok); }
    .dot.err { background:var(--err); }
    .dot.pend { background:#e2e8f0; }
  </style>
</head>
<body>
<div class="container">
  <h1>Diagnóstico de conexión — Apps Script</h1>
  <p class="sub">Prueba cada endpoint individualmente para identificar dónde falla.</p>

  <div class="url-row">
    <input id="urlInput" type="text" placeholder="Pega la URL del Apps Script aquí…"
      value="https://script.google.com/macros/s/AKfycbwdRMtPOxqUj0TeB3dZWXI2jXHx-35FcuTtXo9nPLFrwX69OWOn4fdzigDnvnnTcAZ7Sw/exec" />
    <button class="btn" onclick="probarTodos()">Probar todo</button>
  </div>

  <!-- Resumen -->
  <div class="resumen">
    <h2>Estado de endpoints</h2>
    <ul id="resumenLista">
      <li><span class="dot pend" id="dot-lugares"></span> <span id="res-lugares">lugares — sin probar</span></li>
      <li><span class="dot pend" id="dot-items"></span> <span id="res-items">items — sin probar</span></li>
      <li><span class="dot pend" id="dot-colaboradores"></span> <span id="res-colaboradores">colaboradores — sin probar</span></li>
      <li><span class="dot pend" id="dot-listarSolicitudes"></span> <span id="res-listarSolicitudes">listarSolicitudes — sin probar</span></li>
    </ul>
  </div>

  <!-- Tests individuales -->
  <div id="tests"></div>
</div>

<script>
  const TESTS = [
    { id:"lugares",           nombre:"Lugares",              desc:"Lee hoja LUGAR columna A" },
    { id:"items",             nombre:"Insumos",              desc:"Lee hoja INSUMOS columna A" },
    { id:"colaboradores",     nombre:"Colaboradores",        desc:"Lee hoja COLABORADORES col A+B" },
    { id:"listarSolicitudes", nombre:"Listar solicitudes",   desc:"Lee hoja SOLICITUDES completa" },
  ];

  const resultados = {};

  // Render cards
  const cont = document.getElementById("tests");
  TESTS.forEach(t => {
    const card = document.createElement("div");
    card.className = "test-card";
    card.id = "card-" + t.id;
    card.innerHTML = `
      <div class="test-header">
        <div>
          <div class="test-name">${t.nombre}</div>
          <div class="test-accion">?accion=${t.id}</div>
        </div>
        <button class="btn-test" onclick="probar('${t.id}')">Probar</button>
      </div>
      <div class="test-body">
        <div class="estado esperando" id="estado-${t.id}">Sin probar</div>
        <div class="respuesta" id="resp-${t.id}">—</div>
        <div class="tiempo" id="tiempo-${t.id}"></div>
      </div>`;
    cont.appendChild(card);
  });

  function getURL() {
    return document.getElementById("urlInput").value.trim();
  }

  function probar(accion) {
    const url = getURL();
    if (!url) { alert("Pega la URL del script primero."); return; }

    const inicio = Date.now();
    const estadoEl  = document.getElementById("estado-" + accion);
    const respEl    = document.getElementById("resp-"   + accion);
    const tiempoEl  = document.getElementById("tiempo-" + accion);
    const dotEl     = document.getElementById("dot-"    + accion);
    const resEl     = document.getElementById("res-"    + accion);

    estadoEl.className = "estado cargando";
    estadoEl.innerHTML = '<div class="spinner-sm"></div> Probando…';
    respEl.textContent = "Esperando respuesta…";
    tiempoEl.textContent = "";

    const cbName = "_diag_" + accion + "_" + Date.now();
    const timeout = setTimeout(() => {
      delete window[cbName];
      const ms = Date.now() - inicio;
      estadoEl.className = "estado error";
      estadoEl.textContent = "✗ Timeout (" + ms + "ms)";
      respEl.textContent = "Sin respuesta en 8 segundos.\nPosibles causas:\n- Script no publicado como 'Cualquier persona'\n- URL incorrecta\n- Script no actualizado en Google";
      tiempoEl.textContent = "Tiempo: " + ms + "ms";
      dotEl.className = "dot err";
      resEl.textContent = accion + " — ✗ Timeout";
    }, 8000);

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      const ms = Date.now() - inicio;
      const json = JSON.stringify(data, null, 2);
      resultados[accion] = data;

      if (data.status === "ok") {
        estadoEl.className = "estado ok";
        // Mostrar cantidad de items devueltos
        const claves = Object.keys(data).filter(k => k !== "status");
        const counts = claves.map(k => {
          const v = data[k];
          return k + ": " + (Array.isArray(v) ? v.length + " registros" : v);
        }).join(", ");
        estadoEl.textContent = "✓ OK — " + counts;
        dotEl.className = "dot ok";
        resEl.textContent = accion + " — ✓ OK (" + ms + "ms)";
      } else {
        estadoEl.className = "estado error";
        estadoEl.textContent = "✗ Error — " + (data.mensaje || "sin detalles");
        dotEl.className = "dot err";
        resEl.textContent = accion + " — ✗ " + (data.mensaje || "error");
      }

      respEl.textContent = json;
      tiempoEl.textContent = "Tiempo de respuesta: " + ms + "ms";
    };

    const s = document.createElement("script");
    s.src = url + "?accion=" + accion + "&callback=" + cbName;
    s.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      const ms = Date.now() - inicio;
      estadoEl.className = "estado error";
      estadoEl.textContent = "✗ Error de red";
      respEl.textContent = "El script devolvió un error HTTP.\nVerifica que la URL sea correcta y que esté publicado.";
      tiempoEl.textContent = "Tiempo: " + ms + "ms";
      dotEl.className = "dot err";
      resEl.textContent = accion + " — ✗ Error de red";
    };
    document.head.appendChild(s);
  }

  function probarTodos() {
    TESTS.forEach((t, i) => {
      setTimeout(() => probar(t.id), i * 600);
    });
  }
</script>
</body>
</html>
