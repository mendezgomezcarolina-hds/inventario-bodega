<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inventario" />
  <title>Inventario</title>
  <style>
    :root {
      --bg:        #f2f2f7;
      --surface:   #ffffff;
      --border:    #c6c6c8;
      --accent:    #007aff;
      --accent-dk: #0062cc;
      --success:   #34c759;
      --error:     #ff3b30;
      --warn:      #ff9500;
      --text:      #000000;
      --text2:     #3c3c43;
      --muted:     #8e8e93;
      --radius:    12px;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      min-height: 100dvh;
      padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 32px);
    }

    /* Header */
    .header { display:flex; align-items:center; gap:12px; margin-bottom:22px; padding:0 4px; }
    .header-icon {
      width:46px; height:46px; background:var(--accent); border-radius:12px;
      display:grid; place-items:center; flex-shrink:0;
      box-shadow:0 2px 8px rgba(0,122,255,.35);
    }
    .header-icon svg { width:24px; height:24px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .header h1 { font-size:1.15rem; font-weight:700; color:var(--text); }
    .header p  { font-size:.78rem; color:var(--muted); margin-top:1px; }

    /* Tarjeta */
    .card { background:var(--surface); border-radius:16px; overflow:hidden; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .card-title { font-size:.72rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:14px 16px 6px; }

    /* Filas de campo */
    .field-row {
      display:flex; align-items:center; min-height:52px;
      padding:0 16px; border-bottom:1px solid var(--border); gap:12px;
    }
    .field-row:last-child { border-bottom:none; }
    .field-label { font-size:.95rem; color:var(--text2); font-weight:500; min-width:80px; flex-shrink:0; }

    select, .field-row input {
      flex:1; border:none; outline:none; background:transparent;
      font-family:-apple-system,'SF Pro Text',sans-serif;
      font-size:.95rem; padding:14px 0;
      -webkit-appearance:none; appearance:none;
    }
    select { color:var(--accent); text-align:right; }
    .field-row input { color:var(--text); text-align:right; }
    .field-row input::placeholder { color:var(--muted); }

    .select-wrap { flex:1; display:flex; align-items:center; justify-content:flex-end; position:relative; }
    .select-wrap select { padding-right:18px; }
    .select-wrap::after { content:"›"; color:var(--muted); font-size:1.1rem; position:absolute; right:0; pointer-events:none; transform:rotate(90deg); }

    /* Estado de carga */
    .loading-txt { flex:1; text-align:right; font-size:.9rem; color:var(--muted); font-style:italic; }

    /* Botón agregar */
    .btn-add-row { background:var(--surface); border-radius:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); overflow:hidden; }
    .btn-add {
      width:100%; min-height:54px; background:none; border:none;
      font-family:-apple-system,sans-serif; font-size:1rem; font-weight:600;
      color:var(--accent); cursor:pointer; display:flex; align-items:center;
      justify-content:center; gap:8px; -webkit-appearance:none;
    }
    .btn-add:active { background:rgba(0,0,0,.06); }

    /* Lista */
    #listaWrap { display:none; margin-bottom:12px; }
    .lista-header { display:flex; align-items:center; justify-content:space-between; padding:0 4px 8px; }
    .lista-count { font-size:.72rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
    .btn-limpiar { font-size:.8rem; color:var(--error); background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:8px; font-family:-apple-system,sans-serif; }
    .btn-limpiar:active { background:rgba(255,59,48,.1); }

    .item-card {
      background:var(--surface); border-radius:14px; margin-bottom:8px;
      box-shadow:0 1px 3px rgba(0,0,0,.07);
      display:flex; align-items:center; padding:14px 16px; gap:12px;
      animation:slideIn .18s ease;
    }
    .item-info { flex:1; min-width:0; }
    .item-nombre { font-size:.95rem; font-weight:600; color:var(--text); }
    .item-lugar  { font-size:.8rem; color:var(--muted); margin-top:2px; }
    .item-cant   { font-size:1rem; font-weight:700; color:var(--accent); margin-right:8px; font-variant-numeric:tabular-nums; }
    .btn-del { width:30px; height:30px; background:var(--error); border:none; border-radius:50%; cursor:pointer; display:grid; place-items:center; flex-shrink:0; }
    .btn-del:active { opacity:.7; }
    .btn-del svg { width:14px; height:14px; fill:none; stroke:#fff; stroke-width:2.5; stroke-linecap:round; }
    @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    /* Enviar */
    .btn-submit {
      width:100%; min-height:54px; background:var(--accent); color:#fff;
      font-family:-apple-system,sans-serif; font-size:1.05rem; font-weight:700;
      border:none; border-radius:16px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px;
      margin-bottom:12px; box-shadow:0 2px 12px rgba(0,122,255,.35);
      -webkit-appearance:none;
    }
    .btn-submit:active:not(:disabled) { opacity:.82; transform:scale(.98); }
    .btn-submit:disabled { opacity:.45; }

    .spinner { width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* Toast */
    #toast {
      position:fixed; bottom:calc(var(--safe-bottom) + 24px); left:16px; right:16px;
      padding:14px 18px; border-radius:14px; font-size:.93rem; font-weight:600;
      text-align:center; opacity:0; transform:translateY(10px);
      transition:opacity .25s,transform .25s; pointer-events:none; z-index:999;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    }
    #toast.show { opacity:1; transform:translateY(0); }
    #toast.ok   { background:rgba(52,199,89,.92);  color:#fff; }
    #toast.fail { background:rgba(255,59,48,.92);  color:#fff; }
    #toast.warn { background:rgba(255,149,0,.92);  color:#fff; }

    .config-link { text-align:center; font-size:.75rem; color:var(--muted); padding:4px 0 8px; }
    .config-link a { color:var(--accent); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
    </div>
    <div>
      <h1>Registro de Inventario</h1>
      <p>Dermatología · Hospital del Salvador</p>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Nuevo ítem</div>

    <div class="field-row">
      <span class="field-label">Lugar</span>
      <span class="loading-txt" id="lugarLoading">Cargando…</span>
      <div class="select-wrap" id="lugarWrap" style="display:none">
        <select id="lugar"><option value="" disabled selected>Selecciona…</option></select>
      </div>
    </div>

    <div class="field-row">
      <span class="field-label">Ítem</span>
      <span class="loading-txt" id="itemLoading">Cargando…</span>
      <div class="select-wrap" id="itemWrap" style="display:none">
        <select id="item"><option value="" disabled selected>Selecciona…</option></select>
      </div>
    </div>

    <div class="field-row">
      <span class="field-label">Cantidad</span>
      <input id="cantidad" type="number" min="0" placeholder="0"
             inputmode="numeric" pattern="[0-9]*" />
    </div>
  </div>

  <div class="btn-add-row">
    <button class="btn-add" onclick="agregarALista()">
      <span style="font-size:1.3rem;line-height:1">+</span> Agregar a la lista
    </button>
  </div>

  <div id="listaWrap">
    <div class="lista-header">
      <span class="lista-count" id="listaCount">0 ítems</span>
      <button class="btn-limpiar" onclick="limpiarLista()">✕ Limpiar</button>
    </div>
    <div id="lista"></div>
    <div class="card" style="margin-bottom:12px">
      <div class="field-row">
        <span class="field-label">Nombre</span>
        <input id="usuario" type="text" placeholder="Opcional" style="text-align:right" />
      </div>
    </div>
    <button class="btn-submit" id="btnEnviar" onclick="enviarTodo()">
      Enviar todo al inventario
    </button>
  </div>

  <div class="config-link"><a onclick="pedirURL()">⚙ Configurar URL</a></div>
  <div id="toast"></div>

<script>
  let SCRIPT_URL = localStorage.getItem("inv_script_url") || "";
  let listaItems = [];

  window.onload = () => {
    if (!SCRIPT_URL) pedirURL();
    else { cargarJSONP("lugares"); cargarJSONP("items"); }
  };

  function pedirURL() {
    const url = prompt("Pega la URL del Apps Script:", SCRIPT_URL);
    if (url && url.startsWith("https://")) {
      SCRIPT_URL = url.trim();
      localStorage.setItem("inv_script_url", SCRIPT_URL);
      cargarJSONP("lugares");
      cargarJSONP("items");
    }
  }

  // ── JSONP: compatible con Safari iOS ─────────────────────────
  // Inyecta un <script> con la URL — Safari nunca bloquea scripts externos
  function cargarJSONP(accion) {
    const cbName = "_cb_" + accion + "_" + Date.now();
    const timeout = setTimeout(() => {
      mostrarError(accion);
      delete window[cbName];
    }, 8000);

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      if (accion === "lugares") poblarSelect("lugar", data.lugares, "lugarLoading", "lugarWrap");
      if (accion === "items")   poblarSelect("item",  data.items,   "itemLoading",  "itemWrap");
    };

    const s = document.createElement("script");
    s.src = SCRIPT_URL + "?accion=" + accion + "&callback=" + cbName;
    s.onerror = () => { clearTimeout(timeout); mostrarError(accion); };
    document.head.appendChild(s);
  }

  function poblarSelect(id, lista, loadingId, wrapId) {
    document.getElementById(loadingId).style.display = "none";
    const wrap = document.getElementById(wrapId);
    const sel  = document.getElementById(id);
    if (lista && lista.length > 0) {
      sel.innerHTML = '<option value="" disabled selected>Selecciona…</option>';
      lista.forEach(v => {
        const o = document.createElement("option");
        o.value = v; o.textContent = v; sel.appendChild(o);
      });
      wrap.style.display = "flex";
    } else {
      document.getElementById(loadingId).textContent = "Sin datos";
      document.getElementById(loadingId).style.display = "block";
    }
  }

  function mostrarError(accion) {
    const id = accion === "lugares" ? "lugarLoading" : "itemLoading";
    const el = document.getElementById(id);
    el.textContent = "Error al cargar";
    el.style.color = "var(--error)";
    el.style.display = "block";
  }

  // ── Lista local ───────────────────────────────────────────────
  function agregarALista() {
    const lugar    = document.getElementById("lugar").value;
    const item     = document.getElementById("item").value;
    const cantidad = document.getElementById("cantidad").value.trim();
    if (!lugar || !item || !cantidad || Number(cantidad) < 0) {
      mostrarToast("Completa los tres campos.", "warn"); return;
    }
    listaItems.push({ lugar, item, cantidad });
    renderLista();
    document.getElementById("cantidad").value = "";
    document.getElementById("cantidad").focus();
  }

  function renderLista() {
    const cont = document.getElementById("lista");
    const wrap = document.getElementById("listaWrap");
    document.getElementById("listaCount").textContent =
      listaItems.length + (listaItems.length === 1 ? " ítem" : " ítems");
    wrap.style.display = listaItems.length ? "block" : "none";
    cont.innerHTML = "";
    listaItems.forEach((e, i) => {
      const d = document.createElement("div");
      d.className = "item-card";
      d.innerHTML =
        `<div class="item-info">
          <div class="item-nombre">${e.item}</div>
          <div class="item-lugar">${e.lugar}</div>
        </div>
        <span class="item-cant">${e.cantidad}</span>
        <button class="btn-del" onclick="eliminarItem(${i})">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>`;
      cont.appendChild(d);
    });
  }

  function eliminarItem(i) { listaItems.splice(i, 1); renderLista(); }
  function limpiarLista()  { listaItems = []; renderLista(); }

  // ── Enviar con Image — funciona en iPhone sin CORS ────────────
  function enviarConImagen(params) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = img.onerror = () => resolve();
      img.src = SCRIPT_URL + "?" + params.toString();
      setTimeout(resolve, 5000);
    });
  }

  async function enviarTodo() {
    if (!listaItems.length) { mostrarToast("Agrega al menos un ítem.", "warn"); return; }
    if (!SCRIPT_URL) { pedirURL(); return; }

    const usuario = document.getElementById("usuario").value.trim();
    const btn = document.getElementById("btnEnviar");
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>&nbsp; Enviando…';

    for (const e of listaItems) {
      await enviarConImagen(new URLSearchParams({ ...e, usuario }));
    }

    btn.disabled = false;
    btn.innerHTML = "Enviar todo al inventario";
    mostrarToast(`✓ ${listaItems.length} registro${listaItems.length > 1 ? "s" : ""} enviado${listaItems.length > 1 ? "s" : ""}.`, "ok");
    limpiarLista();
  }

  function mostrarToast(msg, tipo) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.className = "show " + tipo;
    setTimeout(() => { t.className = ""; }, 3000);
  }
</script>
</body>
</html>
