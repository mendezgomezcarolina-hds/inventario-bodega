<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Control de Acceso — Bodega Dermatología HDS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#f0f4f8;--s:#fff;--b:#d1dce8;--ac:#185FA5;--t:#1e293b;--m:#64748b;--ok:#16a34a;--er:#dc2626;--radius:10px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);padding:20px 12px 40px;}
    .wrap{max-width:900px;margin:0 auto;}
    .back{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--m);text-decoration:none;margin-bottom:18px;}
    .back i{font-size:14px;}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
    .htitle{font-size:1rem;font-weight:600;color:var(--t);}
    .hsub{font-size:.72rem;color:var(--m);margin-top:2px;}
    .btn-save{padding:9px 20px;background:var(--ok);color:#fff;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;border:none;border-radius:8px;cursor:pointer;}
    .btn-save:disabled{opacity:.5;cursor:default;}
    .quick{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
    .qbtn{font-size:.72rem;padding:5px 12px;border-radius:99px;border:1.5px solid var(--b);background:var(--s);color:var(--m);cursor:pointer;font-family:'DM Sans',sans-serif;}
    .qbtn:hover{border-color:var(--ac);color:var(--ac);}
    .table-wrap{background:var(--s);border:1px solid var(--b);border-radius:12px;overflow:auto;}
    table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:720px;}
    thead tr{border-bottom:2px solid var(--b);}
    th{padding:10px 10px;text-align:center;font-weight:600;color:var(--m);font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
    th.col-name{text-align:left;min-width:160px;}
    td{padding:8px 10px;border-bottom:0.5px solid var(--b);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:#f8fafc;}
    .user-name{font-size:.85rem;font-weight:500;color:var(--t);}
    .user-id{font-family:'DM Mono',monospace;font-size:.66rem;color:var(--m);margin-top:1px;}
    .badge-admin{font-size:.6rem;font-weight:700;background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:99px;margin-left:5px;}
    .chk-wrap{display:flex;align-items:center;justify-content:center;}
    .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--b);cursor:pointer;display:grid;place-items:center;transition:all .15s;flex-shrink:0;user-select:none;}
    .chk.on{background:var(--ac);border-color:var(--ac);}
    .chk.on::after{content:"✓";color:#fff;font-size:12px;font-weight:700;}
    .chk:hover:not(.locked){border-color:var(--ac);}
    .chk.locked{opacity:.5;cursor:default;}
    .ph-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;margin:0 auto 3px;}
    .ph-lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.02em;font-weight:700;color:var(--m);line-height:1.3;text-align:center;max-width:72px;margin:0 auto;}
    .spinner{width:20px;height:20px;border:2px solid var(--b);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;display:block;}
    @keyframes spin{to{transform:rotate(360deg)}}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:99px;font-size:.82rem;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:200;}
    #toast.show{opacity:1;}
    #toast.ok{background:#15803d;}
    #toast.er{background:#dc2626;}
  </style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back"><i class="ti ti-arrow-left"></i> Volver al portal</a>
  <div class="header">
    <div>
      <div class="htitle">Control de Acceso</div>
      <div class="hsub">Gestiona qué paneles puede ver cada colaborador</div>
    </div>
    <button class="btn-save" id="btnSave" onclick="guardar()">Guardar cambios</button>
  </div>
  <div class="quick">
    <button class="qbtn" onclick="toggleAll(true)">✓ Marcar todos</button>
    <button class="qbtn" onclick="toggleAll(false)">✕ Desmarcar todos</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-name">Colaborador</th>
          <th><div class="ph-ic" style="background:#E1F5EE;color:#0F6E56;"><i class="ti ti-building-warehouse"></i></div><div class="ph-lbl">Recep. por Lugar</div></th>
          <th><div class="ph-ic" style="background:#FCE7F3;color:#9D174D;"><i class="ti ti-chart-bar"></i></div><div class="ph-lbl">Stock por Lugar</div></th>
          <th><div class="ph-ic" style="background:#EBF3FC;color:#185FA5;"><i class="ti ti-clipboard-list"></i></div><div class="ph-lbl">Captura Inventario</div></th>
          <th><div class="ph-ic" style="background:#E1F5EE;color:#0F6E56;"><i class="ti ti-shopping-cart"></i></div><div class="ph-lbl">Solicitud Insumos</div></th>
          <th><div class="ph-ic" style="background:#FAEEDA;color:#854F0B;"><i class="ti ti-truck-delivery"></i></div><div class="ph-lbl">Recep. Bodega</div></th>
          <th><div class="ph-ic" style="background:#EEF2FF;color:#4338CA;"><i class="ti ti-check"></i></div><div class="ph-lbl">Aprobación Solic.</div></th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="7"><div class="spinner"></div></td></tr></tbody>
    </table>
  </div>
</div>
<div id="toast"></div>

<script>
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz10wksjJGvAoSRP8ctI-j4ZKeoVnj2EzNZ-frlzw8ewqOP6JAkqWnB257TYsuZgQMQtQ/exec";
  var _n = 0; var datos = [];
  var ADMIN_ID = "15579172-1"; // Carolina Mendez siempre con acceso total

  // Verificar sesión admin
  var sess = null;
  try { sess = JSON.parse(localStorage.getItem("bodega_user") || "null"); } catch(e){}
  if (!sess) { window.location.replace("login.html"); }

  function jsonp(url, cb) {
    var name = "_ac_" + Date.now() + "_" + (++_n);
    var timer = setTimeout(function(){ delete window[name]; cb(null,"Timeout"); }, 12000);
    window[name] = function(d){ clearTimeout(timer); delete window[name]; cb(d,null); };
    var s = document.createElement("script");
    s.src = url + (url.indexOf("?") > -1 ? "&" : "?") + "callback=" + name;
    s.onerror = function(){ clearTimeout(timer); delete window[name]; cb(null,"Error"); };
    document.head.appendChild(s);
  }

  function toast(msg, tipo) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.className = "show " + (tipo||"");
    setTimeout(function(){ t.className=""; }, 3000);
  }

  window.onload = function() {
    jsonp(SCRIPT_URL + "?accion=obtenerAccesos", function(data, err) {
      if (!data || err || data.status !== "ok") {
        document.getElementById("tbody").innerHTML = '<tr><td colspan="7" style="text-align:center;color:#dc2626;padding:20px;">Error al cargar colaboradores.</td></tr>';
        return;
      }
      datos = data.colaboradores || [];
      render();
    });
  };

  function render() {
    var tb = document.getElementById("tbody");
    tb.innerHTML = "";
    for (var i = 0; i < datos.length; i++) {
      var d = datos[i];
      var isAdmin = d.id === ADMIN_ID;
      var tr = document.createElement("tr");
      var cells = '<td><div class="user-name">' + d.nombre + (isAdmin ? '<span class="badge-admin">admin</span>' : '') + '</div><div class="user-id">' + d.id + '</div></td>';
      for (var j = 0; j < 6; j++) {
        var on = d.accesos[j] ? "on" : "";
        var locked = isAdmin ? "locked" : "";
        cells += '<td><div class="chk-wrap"><div class="chk ' + on + ' ' + locked + '" data-i="' + i + '" data-j="' + j + '" onclick="toggle(this,' + i + ',' + j + ')"></div></div></td>';
      }
      tr.innerHTML = cells;
      tb.appendChild(tr);
    }
  }

  function toggle(el, i, j) {
    if (datos[i].id === ADMIN_ID) return;
    datos[i].accesos[j] = datos[i].accesos[j] ? 0 : 1;
    el.className = "chk" + (datos[i].accesos[j] ? " on" : "");
  }

  function toggleAll(val) {
    for (var i = 0; i < datos.length; i++) {
      if (datos[i].id === ADMIN_ID) continue;
      for (var j = 0; j < 6; j++) datos[i].accesos[j] = val ? 1 : 0;
    }
    render();
  }

  function guardar() {
    var btn = document.getElementById("btnSave");
    btn.disabled = true; btn.textContent = "Guardando…";
    var payload = JSON.stringify(datos.map(function(d){ return { id: d.id, accesos: d.accesos }; }));
    jsonp(SCRIPT_URL + "?accion=guardarAccesos&datos=" + encodeURIComponent(payload), function(data, err) {
      btn.disabled = false; btn.textContent = "Guardar cambios";
      if (!data || err || data.status !== "ok") { toast("Error al guardar.", "er"); return; }
      toast("✓ Accesos guardados correctamente.", "ok");
    });
  }
</script>
</body>
</html>
