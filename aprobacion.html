<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprobación de Solicitudes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #f0f4f8;
      --surface: #fff;
      --border:  #d1dce8;
      --accent:  #185FA5;
      --text:    #1e293b;
      --muted:   #64748b;
      --ok:      #16a34a;
      --ok-bg:   #dcfce7;
      --ok-br:   #bbf7d0;
      --er:      #dc2626;
      --er-bg:   #fee2e2;
      --er-br:   #fecaca;
      --warn-bg: #fef3c7;
      --warn:    #92400e;
      --radius:  10px;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); min-height:100vh; padding:24px 16px; }
    .container { max-width:560px; margin:0 auto; }

    a.back { display:inline-flex; align-items:center; gap:5px; font-size:.75rem; color:var(--muted); text-decoration:none; margin-bottom:18px; }
    a.back svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    a.back:hover { color:var(--accent); }

    .header { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
    .hicon { width:40px; height:40px; background:var(--accent); border-radius:10px; display:grid; place-items:center; flex-shrink:0; }
    .hicon svg { width:20px; height:20px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .header h1 { font-size:1.05rem; font-weight:600; color:var(--text); }
    .header p  { font-size:.75rem; color:var(--muted); margin-top:2px; }

    .sec-label { font-size:.7rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }

    /* ── Stats ── */
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; text-align:center; }
    .stat-n { font-size:1.3rem; font-weight:600; color:var(--text); }
    .stat-l { font-size:.65rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-top:2px; }
    .stat.pend .stat-n { color:#d97706; }
    .stat.apro .stat-n { color:var(--ok); }
    .stat.rech .stat-n { color:var(--er); }

    /* ── Solicitud card ── */
    .sol-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; }
    .sol-head { padding:12px 14px; border-bottom:1px solid var(--border); }
    .sol-id   { font-family:'DM Mono',monospace; font-size:.8rem; font-weight:500; color:var(--accent); margin-bottom:3px; }
    .sol-meta { font-size:.75rem; color:var(--muted); }
    .sol-foot { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
    .badge { font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:99px; text-transform:uppercase; }
    .badge-pend { background:var(--warn-bg); color:var(--warn); }
    .badge-apro { background:var(--ok-bg); color:#15803d; }
    .badge-rech { background:var(--er-bg); color:#991b1b; }
    .badge-parc { background:#e0eaf5; color:var(--accent); }
    .btn-eval { font-family:'DM Sans',sans-serif; font-size:.82rem; font-weight:600; padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); cursor:pointer; display:flex; align-items:center; gap:4px; }
    .btn-eval:hover { border-color:var(--accent); color:var(--accent); }
    .btn-eval svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    /* ── Vista detalle ── */
    #vistaDetalle { display:none; }
    .btn-back { font-family:'DM Sans',sans-serif; font-size:.78rem; color:var(--muted); background:none; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:5px; margin-bottom:14px; padding:0; }
    .btn-back svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .btn-back:hover { color:var(--accent); }

    .det-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .det-head { padding:13px 16px; border-bottom:1px solid var(--border); }
    .det-id   { font-family:'DM Mono',monospace; font-size:.82rem; font-weight:500; color:var(--accent); margin-bottom:3px; }
    .det-meta { font-size:.75rem; color:var(--muted); }

    /* ── Item fila ── */
    .item-fila { padding:11px 16px; border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; }
    .item-fila:last-of-type { border-bottom:none; }
    .item-nom  { font-size:.88rem; font-weight:500; color:var(--text); line-height:1.3; }
    .item-sub  { font-size:.72rem; color:var(--muted); margin-top:3px; }
    .item-btns { display:flex; gap:6px; flex-shrink:0; }
    .btn-ap, .btn-re {
      width:36px; height:36px; border-radius:8px; border:1px solid;
      font-size:.9rem; cursor:pointer; display:grid; place-items:center;
      font-family:'DM Sans',sans-serif; font-weight:600; transition:opacity .1s;
      flex-shrink:0;
    }
    .btn-ap { border-color:var(--ok-br); background:var(--ok-bg); color:var(--ok); }
    .btn-re { border-color:var(--er-br); background:var(--er-bg); color:var(--er); }
    .btn-ap.inactivo, .btn-re.inactivo { opacity:.25; }
    .cant-apro{display:flex;flex-direction:column;gap:2px;margin-right:6px;}
    .cant-apro label{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#0F6E56;}
    .cant-apro input{width:62px;padding:5px 7px;border:1.5px solid #0F6E56;border-radius:6px;font-family:'DM Mono',monospace;font-size:.85rem;font-weight:600;color:#1e293b;background:#E1F5EE;outline:none;text-align:center;}
    .btn-ap.activo { background:var(--ok); color:#fff; border-color:var(--ok); }
    .btn-re.activo { background:var(--er); color:#fff; border-color:var(--er); }
    .item-estado { font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:99px; margin-top:4px; display:inline-block; }

    /* ── Footer detalle ── */
    .det-foot { padding:12px 16px; background:#f8fafc; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .det-prog  { font-size:.78rem; color:var(--muted); }
    .det-prog strong { color:var(--text); }
    .btn-guardar { font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:600; padding:9px 20px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); cursor:pointer; display:flex; align-items:center; gap:6px; }
    .btn-guardar:disabled { opacity:.45; cursor:not-allowed; }
    .btn-guardar svg { width:15px; height:15px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    .spinner { display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); padding:11px 20px; border-radius:10px; font-size:.85rem; font-weight:500; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; z-index:99; white-space:nowrap; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #toast.ok   { background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-br); }
    #toast.fail { background:var(--er-bg); color:var(--er); border:1px solid var(--er-br); }
    #toast.warn { background:var(--warn-bg); color:var(--warn); border:1px solid #fde68a; }

    .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:.9rem; }
    .loading { text-align:center; padding:32px; color:var(--muted); }
    .sp-lg { display:inline-block; width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  </style>
</head>
<body>

<!-- ── Panel principal ─────────────────────────────────────── -->
<div id="panelPrincipal">
<div class="container">

  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Volver al portal
  </a>

  <div class="header">
    <div class="hicon">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    </div>
    <div>
      <h1>Aprobación de Solicitudes</h1>
      <p>Dermatología · Hospital del Salvador</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-n" id="sTotal">—</div><div class="stat-l">Total</div></div>
    <div class="stat pend"><div class="stat-n" id="sPend">—</div><div class="stat-l">Pendientes</div></div>
    <div class="stat apro"><div class="stat-n" id="sApro">—</div><div class="stat-l">Aprobadas</div></div>
    <div class="stat rech"><div class="stat-n" id="sRech">—</div><div class="stat-l">Rechazadas</div></div>
  </div>

  <!-- Botón actualizar -->
  <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
    <button class="btn-eval" onclick="cargarSolicitudes()">
      <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      Actualizar
    </button>
  </div>

  <!-- Vista lista -->
  <div id="vistaLista">
    <div class="loading"><div class="sp-lg"></div></div>
  </div>

  <!-- Vista detalle -->
  <div id="vistaDetalle">
    <button class="btn-back" onclick="volverLista()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Volver a solicitudes
    </button>
    <div class="det-card">
      <div class="det-head">
        <div class="det-id" id="detId"></div>
        <div class="det-meta" id="detMeta"></div>
      </div>
      <div id="detItems"></div>
      <div class="det-foot">
        <div class="det-prog" id="detProg"></div>
        <button class="btn-guardar" id="btnGuardar" onclick="guardarDecisiones()">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          Guardar decisiones
        </button>
      </div>
    </div>
  </div>

</div>
<div id="toast"></div>

<script>
  var supervisorNombre = "";
  var supervisorId     = "";
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz10wksjJGvAoSRP8ctI-j4ZKeoVnj2EzNZ-frlzw8ewqOP6JAkqWnB257TYsuZgQMQtQ/exec";
  var _cbN = 0;
  var todasSolicitudes = [];
  var solicitudActual  = [];
  var decisiones       = {}; // { idx: 'APROBADO' | 'RECHAZADO' | null }
  var cantidades       = {}; // { idx: cantidad aprobada }
  var vencMain         = {}; // { idx: fecha principal }
  var vencExtras       = {}; // { idx: [{qty, fecha}] }

  function jsonp(url, cb) {
    var name  = "_jcb_" + Date.now() + "_" + (++_cbN);
    var timer = setTimeout(function() { delete window[name]; cb(null, "Timeout"); }, 10000);
    window[name] = function(data) { clearTimeout(timer); delete window[name]; cb(data, null); };
    var s = document.createElement("script");
    s.src = url + (url.indexOf("?") > -1 ? "&" : "?") + "callback=" + name;
    s.onerror = function() { clearTimeout(timer); delete window[name]; cb(null, "Error de red"); };
    document.head.appendChild(s);
  }

  window.onload = function() {
    var sess = null;
    try { sess = JSON.parse(localStorage.getItem("bodega_user") || "null"); } catch(e) {}
    if (!sess) { window.location.replace("login.html"); return; }
    supervisorNombre = sess.nombre || "";
    supervisorId     = sess.id     || "";
    cargarSolicitudes();
  };

  function cargarSolicitudes() {
    document.getElementById("vistaLista").innerHTML = '<div class="loading"><div class="sp-lg"></div></div>';
    jsonp(SCRIPT_URL + "?accion=listarSolicitudes", function(data, err) {
      if (!data || err) {
        document.getElementById("vistaLista").innerHTML = '<div class="empty">Error de conexión. Verifica el script.</div>';
        return;
      }
      todasSolicitudes = data.solicitudes || [];
      actualizarStats();
      renderLista();
    });
  }

  function actualizarStats() {
    var grupos = agrupar(todasSolicitudes);
    var ids    = Object.keys(grupos);
    var pend = 0, apro = 0, rech = 0;
    ids.forEach(function(id) {
      var est = estadoGrupo(grupos[id]);
      if (est === "PENDIENTE" || est === "PARCIAL") pend++;
      else if (est === "APROBADO") apro++;
      else if (est === "RECHAZADO") rech++;
    });
    document.getElementById("sTotal").textContent = ids.length;
    document.getElementById("sPend").textContent  = pend;
    document.getElementById("sApro").textContent  = apro;
    if (document.getElementById("sRech")) document.getElementById("sRech").textContent = rech;
  }

  function agrupar(lista) {
    var g = {};
    for (var i = 0; i < lista.length; i++) {
      var s = lista[i];
      if (!g[s.id]) g[s.id] = [];
      g[s.id].push(s);
    }
    return g;
  }

  function estadoGrupo(filas) {
    var estados = filas.map(function(f) { return (f.estado || "").toUpperCase().trim(); });
    var RESUELTO = ["APROBADO","RECEPCIONADO"];
    var RECHAZ   = ["RECHAZADO"];
    if (estados.every(function(e) { return RESUELTO.indexOf(e) !== -1; })) return "APROBADO";
    if (estados.every(function(e) { return RECHAZ.indexOf(e) !== -1; }))   return "RECHAZADO";
    if (estados.every(function(e) { return e === "PENDIENTE"; }))           return "PENDIENTE";
    // Si hay mezcla de resueltos + pendientes → PARCIAL
    // Si todos están resueltos (incluyendo RECEPCIONADO) → APROBADO
    var hayPendiente = estados.some(function(e) { return e === "PENDIENTE"; });
    var hayResuelto  = estados.some(function(e) { return RESUELTO.indexOf(e) !== -1 || RECHAZ.indexOf(e) !== -1; });
    if (hayResuelto && !hayPendiente) return "APROBADO";
    return "PARCIAL";
  }

  function renderLista() {
    var cont   = document.getElementById("vistaLista");
    var grupos = agrupar(todasSolicitudes);
    var ids    = Object.keys(grupos).reverse();

    if (!ids.length) { cont.innerHTML = '<div class="empty">No hay solicitudes.</div>'; return; }
    cont.innerHTML = "";

    ids.forEach(function(id) {
      var filas  = grupos[id];
      var f0     = filas[0];
      var est    = estadoGrupo(filas);
      var aprobN = filas.filter(function(f) { return (f.estado||"").toUpperCase().trim() === "APROBADO"; }).length;
      var badgeClass = est === "PARCIAL" ? "badge-parc" :
                       est === "APROBADO" ? "badge-apro" :
                       est === "RECHAZADO" ? "badge-rech" : "badge-pend";
      var badgeTxt = est === "PARCIAL" ? aprobN + "/" + filas.length + " aprobados" : est;

      var div = document.createElement("div");
      div.className = "sol-card";
      div.innerHTML =
        '<div class="sol-head">' +
          '<div class="sol-id">' + id + '</div>' +
          '<div class="sol-meta">' + (f0.responsable || "—") + " · " + (f0.lugar || "—") + " · " + filas.length + " ítem" + (filas.length > 1 ? "s" : "") + " · " + (f0.fecha || "—") + '</div>' +
        '</div>' +
        '<div class="sol-foot">' +
          '<span class="badge ' + badgeClass + '">' + badgeTxt + '</span>' +
          '<button class="btn-eval" onclick="abrirDetalle(\'' + id.replace(/'/g, "\\'") + '\')">' +
            'Evaluar <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 18l6-6-6-6"/></svg>' +
          '</button>' +
        '</div>';
      cont.appendChild(div);
    });
  }

  function abrirDetalle(id) {
    var grupos = agrupar(todasSolicitudes);
    solicitudActual = grupos[id] || [];
    decisiones = {};
    cantidades  = {};
    vencMain    = {};
    vencExtras  = {};
    for (var i = 0; i < solicitudActual.length; i++) {
      var est = (solicitudActual[i].estado || "").toUpperCase().trim();
      decisiones[i]  = (est === "APROBADO" || est === "RECHAZADO") ? est : null;
      vencExtras[i]  = [];
    }
    document.getElementById("vistaLista").style.display   = "none";
    document.getElementById("vistaDetalle").style.display = "block";
    renderDetalle();
  }

  function volverLista() {
    document.getElementById("vistaDetalle").style.display = "none";
    document.getElementById("vistaLista").style.display   = "block";
  }

  function renderDetalle() {
    var f0 = solicitudActual[0] || {};
    document.getElementById("detId").textContent   = f0.id || "";
    document.getElementById("detMeta").textContent = (f0.responsable || "—") + " · " + (f0.lugar || "—");

    var html = "";
    for (var i = 0; i < solicitudActual.length; i++) {
      var f   = solicitudActual[i];
      var dec = decisiones[i];
      var est = (f.estado || "").toUpperCase().trim();

      var apCls = dec === "APROBADO"  ? "btn-ap activo" : "btn-ap" + (dec === "RECHAZADO" ? " inactivo" : "");
      var reCls = dec === "RECHAZADO" ? "btn-re activo" : "btn-re" + (dec === "APROBADO"  ? " inactivo" : "");
      var cantVal  = cantidades[i] !== undefined ? cantidades[i] : (f.cantidad || "");
      var showBody = dec === "APROBADO" ? "" : "display:none;";

      html +=
        '<div class="item-fila" id="ifila-' + i + '" style="flex-direction:column;align-items:stretch;">' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<div style="flex:1">' +
              '<div class="item-nom">' + (f.item || "—") + '</div>' +
              '<div class="item-sub">Cód: ' + (f.codigo || "—") + ' · Solicitado: ' + (f.cantidad || "—") + '</div>' +
            '</div>' +
            '<div class="item-btns" style="align-items:center">' +
              '<button class="' + apCls + '" onclick="toggleDec(' + i + ',\'APROBADO\')" title="Aprobar">✓</button>' +
              '<button class="' + reCls + '" onclick="toggleDec(' + i + ',\'RECHAZADO\')" title="Rechazar">✕</button>' +
            '</div>' +
          '</div>' +
          '<div id="venc-body-' + i + '" style="padding:6px 0 4px 0;' + showBody + '">' +
            '<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">' +
              '<input type="number" min="0" id="cant-input-' + i + '" value="' + cantVal + '" onchange="cantidades[' + i + ']=this.value;validarVenc(' + i + ')" style="width:62px;font-size:.78rem;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;background:#f8fafc;color:var(--text);" />' +
              '<input type="date" id="venc-main-' + i + '" value="' + (vencMain[i]||"") + '" onchange="vencMain[' + i + ']=this.value" style="flex:1;font-size:.78rem;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;background:#f8fafc;color:var(--text);" />' +
              '<button onclick="addVencExtra(' + i + ')" style="font-size:.72rem;padding:4px 8px;border:1.5px solid var(--accent);border-radius:6px;color:var(--accent);background:transparent;cursor:pointer;white-space:nowrap;">+ fecha</button>' +
            '</div>' +
            '<div id="venc-extras-' + i + '"></div>' +
            '<div id="venc-al-' + i + '" style="font-size:.72rem;color:var(--er);display:none;margin-top:2px;"></div>' +
          '</div>' +
        '</div>';
    }
    document.getElementById("detItems").innerHTML = html;
    for (var ii = 0; ii < solicitudActual.length; ii++) { renderVencExtras(ii); }
    actualizarProgreso();
  }

  function toggleDec(i, estado) {
    decisiones[i] = decisiones[i] === estado ? null : estado;
    if (decisiones[i] === "APROBADO" && cantidades[i] === undefined) {
      cantidades[i] = solicitudActual[i].cantidad || "";
    }
    renderDetalle();
  }

  function actualizarProgreso() {
    var total  = solicitudActual.length;
    var apro   = 0;
    var rech   = 0;
    var sin    = 0;
    for (var i = 0; i < total; i++) {
      if (decisiones[i] === "APROBADO")  apro++;
      else if (decisiones[i] === "RECHAZADO") rech++;
      else sin++;
    }
    var resueltos = apro + rech;
    document.getElementById("detProg").innerHTML =
      "<strong>" + resueltos + " de " + total + "</strong> · " + apro + " aprobado" + (apro !== 1 ? "s" : "") + " · " + rech + " rechazado" + (rech !== 1 ? "s" : "");
    document.getElementById("btnGuardar").disabled = resueltos === 0;
  }

  // Envío secuencial sin async/await
  var _envIdx = 0;
  var _envItems = [];
  var _envErr = 0;

  function addVencExtra(i) {
    if (!vencExtras[i]) vencExtras[i] = [];
    vencExtras[i].push({qty:'',fecha:''});
    renderVencExtras(i);
  }
  function delVencExtra(i,j) {
    vencExtras[i].splice(j,1);
    renderVencExtras(i);
    validarVenc(i);
  }
  function renderVencExtras(i) {
    var el = document.getElementById('venc-extras-'+i);
    if (!el) return;
    var h = '';
    (vencExtras[i]||[]).forEach(function(v,j){
      h += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">';
      h += '<input type="number" placeholder="Cant." min="1" value="'+(v.qty||'')+'" oninput="vencExtras['+i+']['+j+'].qty=+this.value;validarVenc('+i+')" style="width:58px;font-size:.78rem;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;background:#f8fafc;color:var(--text);" />';
      h += '<input type="date" value="'+(v.fecha||'')+'" oninput="vencExtras['+i+']['+j+'].fecha=this.value" style="flex:1;font-size:.78rem;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;background:#f8fafc;color:var(--text);" />';
      h += '<button onclick="delVencExtra('+i+','+j+')" style="font-size:.72rem;padding:3px 6px;border:1.5px solid var(--er);border-radius:6px;color:var(--er);background:transparent;cursor:pointer;">✕</button>';
      h += '</div>';
    });
    el.innerHTML = h;
  }
  function validarVenc(i) {
    var tot = +(cantidades[i]||0);
    var rows = vencExtras[i]||[];
    var al = document.getElementById('venc-al-'+i);
    if (!al||!rows.length){if(al)al.style.display='none';return;}
    var suma = rows.reduce(function(a,r){return a+(+r.qty||0);},0);
    if (suma !== tot) { al.style.display='block'; al.textContent='Suma '+suma+' ≠ '+tot; }
    else { al.style.display='none'; }
  }
  function buildFechaVenc(i) {
    var main = document.getElementById('venc-main-'+i);
    var mainFecha = main ? main.value : (vencMain[i]||'');
    var extras = vencExtras[i]||[];
    // Sin extras: retorna solo la fecha simple
    if (!extras.length) return mainFecha;
    // Con extras: construir siempre "qty:fecha|qty:fecha"
    var partes = [];
    var cantMain = +(cantidades[i]||0) - extras.reduce(function(a,r){return a+(+r.qty||0);},0);
    if (cantMain > 0 && mainFecha) partes.push(cantMain+':'+mainFecha);
    extras.forEach(function(v){ if(v.qty && v.fecha) partes.push(v.qty+':'+v.fecha); });
    // Si solo quedó una parte, igual usar formato qty:fecha (con pipe vacío no, sino directo)
    if (partes.length === 1) return partes[0]; // "qty:fecha" — GS debe parsear esto
    return partes.join('|');
  }

  function guardarDecisiones() {
    var pendientes = [];
    for (var i = 0; i < solicitudActual.length; i++) {
      if (decisiones[i] !== null) {
        var f = solicitudActual[i];
        var estActual = (f.estado || "").toUpperCase().trim();
        if (estActual !== decisiones[i]) {
          pendientes.push({ i: i, f: f, dec: decisiones[i] });
        }
      }
    }
    if (!pendientes.length) { toast("No hay cambios nuevos.", "warn"); return; }

    var btn = document.getElementById("btnGuardar");
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Guardando\u2026';

    _envIdx   = 0;
    _envItems = pendientes;
    _envErr   = 0;
    enviarUno();
  }

  function enviarUno() {
    if (_envIdx >= _envItems.length) {
      var btn = document.getElementById("btnGuardar");
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> Guardar decisiones';

      if (_envErr === 0) {
        // Actualizar local
        for (var k = 0; k < _envItems.length; k++) {
          var it = _envItems[k];
          for (var j = 0; j < todasSolicitudes.length; j++) {
            var s = todasSolicitudes[j];
            if (s.id === it.f.id && s.item === it.f.item && s.lugar === it.f.lugar) {
              s.estado = it.dec;
            }
          }
          solicitudActual[it.i].estado = it.dec;
        }
        actualizarStats();
        toast("\u2713 Decisiones guardadas correctamente.", "ok");
        setTimeout(function() { volverLista(); renderLista(); }, 1200);
      } else {
        toast(_envErr + " error(es) al guardar.", "fail");
        renderDetalle();
      }
      return;
    }

    var item = _envItems[_envIdx];
    var f    = item.f;
    var dec  = item.dec;

    var cantAprobada = (cantidades[item.i] !== undefined && cantidades[item.i] !== "")
      ? cantidades[item.i]
      : (f.cantidad || "");
    var fechaVenc = buildFechaVenc(item.i);
    var url = SCRIPT_URL +
      "?accion=actualizarEstado" +
      "&idSolicitud="   + encodeURIComponent(f.id || "") +
      "&item="          + encodeURIComponent(f.item || "") +
      "&lugar="         + encodeURIComponent(f.lugar || "") +
      "&estado="        + encodeURIComponent(dec) +
      "&cantAprobada="  + encodeURIComponent(cantAprobada) +
      "&fechaVenc="     + encodeURIComponent(fechaVenc);

    jsonp(url, function(data, err) {
      if (!data || err || data.status !== "ok") _envErr++;
      _envIdx++;
      setTimeout(enviarUno, 300);
    });
  }

  function toast(msg, tipo) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.className = "show " + tipo;
    setTimeout(function() { t.className = ""; }, 3500);
  }
</script>
</body>
</html>
